<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 310" width="100%" height="100%">
  <defs>
    <linearGradient id="bgVip" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#050814" />
      <stop offset="45%" stop-color="#0f1530" />
      <stop offset="100%" stop-color="#1e0d38" />
    </linearGradient>
    <radialGradient id="glow1" cx="15%" cy="20%" r="45%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.28" />
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0" />
    </radialGradient>
    <radialGradient id="glow2" cx="85%" cy="80%" r="48%">
      <stop offset="0%" stop-color="#f472b6" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#f472b6" stop-opacity="0" />
    </radialGradient>
    <radialGradient id="glow3" cx="55%" cy="15%" r="35%">
      <stop offset="0%" stop-color="#a78bfa" stop-opacity="0.20" />
      <stop offset="100%" stop-color="#a78bfa" stop-opacity="0" />
    </radialGradient>
    <linearGradient id="vipTitle" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="35%" stop-color="#818cf8" />
      <stop offset="70%" stop-color="#e879f9" />
      <stop offset="100%" stop-color="#fb7185" />
    </linearGradient>
    <linearGradient id="borderNeon" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#a78bfa" />
      <stop offset="100%" stop-color="#f472b6" />
    </linearGradient>
    <linearGradient id="scanBeam" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0" />
      <stop offset="50%" stop-color="#38bdf8" stop-opacity="0.85" />
      <stop offset="100%" stop-color="#f472b6" stop-opacity="0" />
    </linearGradient>

    <style>
      @keyframes blink { 0%, 100% { opacity: 1; } 50% { opacity: 0.2; } }
      @keyframes floatY { 0%, 100% { transform: translateY(0px); } 50% { transform: translateY(-4px); } }
      @keyframes scanMove { 0% { transform: translateY(0px); opacity: 0; } 15% { opacity: 0.7; } 85% { opacity: 0.7; } 100% { transform: translateY(306px); opacity: 0; } }
      @keyframes bar1 { 0%, 100% { width: 120px; } 50% { width: 175px; } }
      @keyframes bar2 { 0%, 100% { width: 155px; } 50% { width: 70px; } }
      @keyframes eq1 { 0%, 100% { height: 10px; y: 20px; } 50% { height: 28px; y: 2px; } }
      @keyframes eq2 { 0%, 100% { height: 24px; y: 6px; } 50% { height: 10px; y: 20px; } }
      @keyframes eq3 { 0%, 100% { height: 16px; y: 14px; } 50% { height: 28px; y: 2px; } }
      @keyframes eq4 { 0%, 100% { height: 28px; y: 2px; } 50% { height: 12px; y: 18px; } }
      @keyframes starTwinkle { 0%, 100% { opacity: 0.25; } 50% { opacity: 0.95; } }

      .dot { animation: blink 1.2s infinite ease-in-out; }
      .float-cards { animation: floatY 3.5s ease-in-out infinite; }
      .laser { animation: scanMove 5s linear infinite; }
      .caf-bar { animation: bar1 3.8s ease-in-out infinite; }
      .san-bar { animation: bar2 4.5s ease-in-out infinite; }
      .eq-a { animation: eq1 0.9s ease-in-out infinite; }
      .eq-b { animation: eq2 0.75s ease-in-out infinite; }
      .eq-c { animation: eq3 1.1s ease-in-out infinite; }
      .eq-d { animation: eq4 0.85s ease-in-out infinite; }
      .star1 { animation: starTwinkle 2.1s infinite; }
      .star2 { animation: starTwinkle 3.2s 0.7s infinite; }
      .star3 { animation: starTwinkle 2.6s 1.3s infinite; }
    </style>
  </defs>

  <!-- Canvas -->
  <rect width="920" height="310" rx="18" fill="url(#bgVip)" />
  <rect width="920" height="310" rx="18" fill="url(#glow1)" />
  <rect width="920" height="310" rx="18" fill="url(#glow2)" />
  <rect width="920" height="310" rx="18" fill="url(#glow3)" />

  <!-- Grid -->
  <g stroke="#38bdf8" stroke-opacity="0.05" stroke-width="1">
    <line x1="0" y1="62" x2="920" y2="62" />
    <line x1="0" y1="124" x2="920" y2="124" />
    <line x1="0" y1="186" x2="920" y2="186" />
    <line x1="0" y1="248" x2="920" y2="248" />
    <line x1="184" y1="0" x2="184" y2="310" />
    <line x1="368" y1="0" x2="368" y2="310" />
    <line x1="552" y1="0" x2="552" y2="310" />
    <line x1="736" y1="0" x2="736" y2="310" />
  </g>

  <!-- Twinkling Stars -->
  <g fill="#e2e8f0">
    <circle cx="670" cy="78" r="1.8" class="star1" />
    <circle cx="720" cy="112" r="1.4" class="star2" />
    <circle cx="810" cy="68" r="2.1" class="star3" />
    <circle cx="850" cy="128" r="1.5" class="star1" />
    <circle cx="620" cy="136" r="1.3" class="star2" />
  </g>

  <!-- Scanline -->
  <rect class="laser" x="12" y="0" width="896" height="2" fill="url(#scanBeam)" />

  <!-- Outer Frame -->
  <rect x="1.5" y="1.5" width="917" height="307" rx="17" fill="none" stroke="url(#borderNeon)" stroke-opacity="0.65" stroke-width="1.5" />

  <!-- Top HUD Bar -->
  <g transform="translate(38, 36)" font-family="monospace" font-size="12">
    <circle cx="6" cy="-4" r="4.5" fill="#4ade80" class="dot" />
    <text x="18" y="0" fill="#cbd5e1" font-weight="bold">DINHQUAN1005 // VIP LOUNGE v9.9</text>
    <rect x="652" y="-14" width="192" height="20" rx="10" fill="#f472b6" fill-opacity="0.16" stroke="#f472b6" stroke-opacity="0.5" />
    <text x="748" y="0" text-anchor="middle" fill="#f9a8d4" font-size="10.5" font-weight="bold">☕ CAFFEINE: CRITICAL</text>
  </g>

  <!-- Hero Title + Equalizer -->
  <g transform="translate(38, 108)">
    <text font-family="'Segoe UI', -apple-system, BlinkMacSystemFont, Roboto, sans-serif" font-size="44" font-weight="900" fill="url(#vipTitle)">
      Chào, tôi là Đinh Quân 👋
    </text>
    <text y="36" font-family="monospace" font-size="15.5" fill="#e2e8f0">
      "Code chạy được trên máy tôi là được — đừng hỏi vì sao ¯\_(ツ)_/¯"
    </text>

    <!-- Neon Equalizer Badge on the right -->
    <g transform="translate(740, -28)">
      <rect width="104" height="58" rx="12" fill="#090e1c" fill-opacity="0.85" stroke="#818cf8" stroke-opacity="0.45" />
      <g transform="translate(18, 10)">
        <rect class="eq-a" x="0" width="6" rx="3" fill="#38bdf8" />
        <rect class="eq-b" x="14" width="6" rx="3" fill="#818cf8" />
        <rect class="eq-c" x="28" width="6" rx="3" fill="#c084fc" />
        <rect class="eq-d" x="42" width="6" rx="3" fill="#f472b6" />
        <rect class="eq-a" x="56" width="6" rx="3" fill="#fb7185" />
      </g>
      <text x="52" y="51" text-anchor="middle" font-family="monospace" font-size="9" fill="#94a3b8" font-weight="bold">LO-FI CHILL</text>
    </g>
  </g>

  <!-- 4 Floating Status Cards (Outer group keeps position, inner animates Y) -->
  <g transform="translate(38, 202)">
    <g class="float-cards" font-family="monospace">
      <!-- Card 1 -->
      <rect width="200" height="72" rx="12" fill="#090e1c" fill-opacity="0.88" stroke="#38bdf8" stroke-opacity="0.45" />
      <text x="14" y="23" font-size="10" fill="#38bdf8" font-weight="bold">⚡ NĂNG LƯỢNG</text>
      <rect x="14" y="34" width="172" height="7" rx="3.5" fill="#1e293b" />
      <rect class="caf-bar" x="14" y="34" width="140" height="7" rx="3.5" fill="#38bdf8" />
      <text x="14" y="58" font-size="11" fill="#94a3b8">Cà phê đá không đường</text>

      <!-- Card 2 -->
      <rect x="215" width="200" height="72" rx="12" fill="#090e1c" fill-opacity="0.88" stroke="#a78bfa" stroke-opacity="0.45" />
      <text x="229" y="23" font-size="10" fill="#a78bfa" font-weight="bold">🐛 TIẾN ĐỘ BUG</text>
      <text x="229" y="45" font-size="12.5" fill="#f8fafc" font-weight="bold">Fix 1 → Đẻ 3 mới</text>
      <text x="229" y="61" font-size="10.5" fill="#94a3b8">Feature chứ không phải bug</text>

      <!-- Card 3 -->
      <rect x="430" width="200" height="72" rx="12" fill="#090e1c" fill-opacity="0.88" stroke="#f472b6" stroke-opacity="0.45" />
      <text x="444" y="23" font-size="10" fill="#f472b6" font-weight="bold">🧠 ĐỘ TỈNH TÁO</text>
      <rect x="444" y="34" width="172" height="7" rx="3.5" fill="#1e293b" />
      <rect class="san-bar" x="444" y="34" width="110" height="7" rx="3.5" fill="#f472b6" />
      <text x="444" y="58" font-size="11" fill="#94a3b8">Sắp hết pin rồi...</text>

      <!-- Card 4 -->
      <rect x="645" width="200" height="72" rx="12" fill="#090e1c" fill-opacity="0.88" stroke="#4ade80" stroke-opacity="0.45" />
      <text x="659" y="23" font-size="10" fill="#4ade80" font-weight="bold">🌙 GIẤC NGỦ</text>
      <text x="659" y="45" font-size="13" fill="#f8fafc" font-weight="bold">404 Not Found</text>
      <text x="659" y="61" font-size="10.5" fill="#94a3b8">Hẹn mai ngủ bù (xạo)</text>
    </g>
  </g>
</svg>
