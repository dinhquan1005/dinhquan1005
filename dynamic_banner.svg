<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 260" width="100%" height="100%">
  <defs>
    <linearGradient id="bgFun" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b1020" />
      <stop offset="50%" stop-color="#131936" />
      <stop offset="100%" stop-color="#1a1033" />
    </linearGradient>
    <linearGradient id="neonTitle" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#a78bfa" />
      <stop offset="100%" stop-color="#f472b6" />
    </linearGradient>
    <style>
      @keyframes blink { 0%, 100% { opacity: 1; } 50% { opacity: 0.25; } }
      @keyframes float { 0%, 100% { transform: translateY(0px); } 50% { transform: translateY(-4px); } }
      @keyframes barFill { 0%, 100% { width: 120px; } 50% { width: 185px; } }
      .dot { animation: blink 1.3s infinite ease-in-out; }
      .float-box { animation: float 3.2s ease-in-out infinite; }
      .caffeine-bar { animation: barFill 4s ease-in-out infinite; }
    </style>
  </defs>

  <rect width="880" height="260" rx="16" fill="url(#bgFun)" stroke="#38bdf8" stroke-opacity="0.25" stroke-width="1.5" />

  <!-- Top Bar -->
  <g transform="translate(36, 36)" font-family="monospace" font-size="12">
    <circle cx="6" cy="-4" r="5" fill="#4ade80" class="dot" />
    <text x="20" y="0" fill="#94a3b8" font-weight="bold">DINHQUAN1005 // ONLINE (CHẮC VẬY)</text>
    <text x="808" y="0" text-anchor="end" fill="#f472b6">COFFEE_LEVEL: CRITICAL</text>
  </g>

  <!-- Main Title -->
  <g transform="translate(36, 98)">
    <text font-family="'Segoe UI', sans-serif" font-size="40" font-weight="900" fill="url(#neonTitle)">
      Chào, tôi là Đinh Quân 👋
    </text>
    <text y="34" font-family="monospace" font-size="15" fill="#e2e8f0">
      "Code chạy được trên máy tôi là được ¯\_(ツ)_/¯"
    </text>
  </g>

  <!-- Funny Status Pills -->
  <g class="float-box" transform="translate(36, 172)" font-family="monospace">
    <!-- Pill 1: Caffeine -->
    <rect width="250" height="54" rx="10" fill="#090d1a" stroke="#38bdf8" stroke-opacity="0.35" />
    <text x="14" y="21" font-size="10" fill="#38bdf8" font-weight="bold">NĂNG LƯỢNG CÀ PHÊ</text>
    <rect x="14" y="32" width="220" height="8" rx="4" fill="#1e293b" />
    <rect class="caffeine-bar" x="14" y="32" width="150" height="8" rx="4" fill="#38bdf8" />

    <!-- Pill 2: Bugs -->
    <rect x="275" width="250" height="54" rx="10" fill="#090d1a" stroke="#a78bfa" stroke-opacity="0.35" />
    <text x="289" y="21" font-size="10" fill="#a78bfa" font-weight="bold">TIẾN ĐỘ FIX BUG</text>
    <text x="289" y="42" font-size="13" fill="#e2e8f0">Sửa 1 bug → đẻ 3 bug mới</text>

    <!-- Pill 3: Sleep -->
    <rect x="550" width="258" height="54" rx="10" fill="#090d1a" stroke="#f472b6" stroke-opacity="0.35" />
    <text x="564" y="21" font-size="10" fill="#f472b6" font-weight="bold">GIẤC NGỦ</text>
    <text x="564" y="42" font-size="13" fill="#e2e8f0">404 Not Found 🌙</text>
  </g>
</svg>
