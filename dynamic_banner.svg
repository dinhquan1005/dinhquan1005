<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 850 340" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#080c14" />
      <stop offset="50%" stop-color="#0e1726" />
      <stop offset="100%" stop-color="#05080f" />
    </linearGradient>
    <linearGradient id="cyanGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00f5d4" stop-opacity="0" />
      <stop offset="50%" stop-color="#00f5d4" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#00f5d4" stop-opacity="0" />
    </linearGradient>
    <radialGradient id="radarGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#00f5d4" stop-opacity="0.35" />
      <stop offset="100%" stop-color="#00f5d4" stop-opacity="0" />
    </radialGradient>

    <style>
      @keyframes scan {
        0% { transform: translateY(0); opacity: 0; }
        15% { opacity: 0.9; }
        85% { opacity: 0.9; }
        100% { transform: translateY(340px); opacity: 0; }
      }
      @keyframes radarSweep {
        0% { transform: rotate(0deg); }
        100% { transform: rotate(360deg); }
      }
      @keyframes blink {
        0%, 100% { opacity: 1; }
        50% { opacity: 0.2; }
      }
      @keyframes eqBar1 { 0%, 100% { height: 8px; y: 22px; } 50% { height: 26px; y: 4px; } }
      @keyframes eqBar2 { 0%, 100% { height: 22px; y: 8px; } 50% { height: 12px; y: 18px; } }
      @keyframes eqBar3 { 0%, 100% { height: 16px; y: 14px; } 50% { height: 28px; y: 2px; } }
      @keyframes eqBar4 { 0%, 100% { height: 26px; y: 4px; } 50% { height: 9px; y: 21px; } }
      @keyframes barGrow { 0%, 100% { width: 85px; } 50% { width: 140px; } }
      @keyframes barGrow2 { 0%, 100% { width: 125px; } 50% { width: 65px; } }
      @keyframes streamRain {
        0% { transform: translateY(-50px); opacity: 0; }
        50% { opacity: 0.6; }
        100% { transform: translateY(240px); opacity: 0; }
      }

      .scanner-beam { animation: scan 3.8s cubic-bezier(0.4, 0, 0.2, 1) infinite; }
      .radar-arm { transform-origin: 735px 170px; animation: radarSweep 4.5s linear infinite; }
      .pulsing-dot { animation: blink 1.2s infinite ease-in-out; }
      .eq-1 { animation: eqBar1 1.2s ease-in-out infinite; }
      .eq-2 { animation: eqBar2 0.9s ease-in-out infinite; }
      .eq-3 { animation: eqBar3 1.5s ease-in-out infinite; }
      .eq-4 { animation: eqBar4 1.1s ease-in-out infinite; }
      .bar-dynamic { animation: barGrow 3s ease-in-out infinite; }
      .bar-dynamic-2 { animation: barGrow2 2.4s ease-in-out infinite; }
      .rain-col1 { animation: streamRain 3.2s linear infinite; }
      .rain-col2 { animation: streamRain 4s linear 1s infinite; }
    </style>
  </defs>

  <rect width="850" height="340" rx="14" fill="url(#bgGrad)" stroke="#1e293b" stroke-width="2" />

  <!-- Cyber Grid -->
  <g stroke="#00f5d4" stroke-opacity="0.04" stroke-width="1">
    <line x1="0" y1="40" x2="850" y2="40" /><line x1="0" y1="80" x2="850" y2="80" />
    <line x1="0" y1="120" x2="850" y2="120" /><line x1="0" y1="160" x2="850" y2="160" />
    <line x1="0" y1="200" x2="850" y2="200" /><line x1="0" y1="240" x2="850" y2="240" />
    <line x1="0" y1="280" x2="850" y2="280" />
    <line x1="120" y1="0" x2="120" y2="340" /><line x1="280" y1="0" x2="280" y2="340" />
    <line x1="460" y1="0" x2="460" y2="340" /><line x1="620" y1="0" x2="620" y2="340" />
  </g>

  <!-- Outer Neon Border Frame -->
  <rect x="8" y="8" width="834" height="324" rx="10" fill="none" stroke="#00f5d4" stroke-opacity="0.25" stroke-width="1" />
  <path d="M 8 35 L 35 8 M 842 35 L 815 8 M 8 305 L 35 332 M 842 305 L 815 332" stroke="#00f5d4" stroke-width="2" stroke-opacity="0.8" fill="none" />

  <!-- Laser Scan Beam -->
  <rect class="scanner-beam" x="10" y="0" width="830" height="2" fill="url(#cyanGrad)" />

  <!-- Rain Code -->
  <g font-family="monospace" font-size="9" fill="#00f5d4" opacity="0.25">
    <text class="rain-col1" x="25" y="0">0x7FFE0330<tspan x="25" dy="14">48 8B 05</tspan><tspan x="25" dy="14">VMT_HOOK</tspan></text>
    <text class="rain-col2" x="150" y="0">PAGE_RWX<tspan x="150" dy="14">0xDEADBEEF</tspan><tspan x="150" dy="14">NT_SYSCALL</tspan></text>
  </g>

  <!-- Header Info -->
  <g font-family="monospace" font-size="11">
    <circle cx="32" cy="30" r="4" fill="#00f5d4" class="pulsing-dot" />
    <text x="44" y="34" fill="#00f5d4" font-weight="bold" letter-spacing="2">DINHQUAN1005 // REVERSE BENCH</text>
    <text x="560" y="34" fill="#64748b">ARCH: <tspan fill="#38bdf8">x86_64</tspan> | SUBSYS: <tspan fill="#4ade80">D3D11 / NT</tspan></text>
  </g>

  <!-- Main Hero Title -->
  <g transform="translate(32, 90)">
    <text font-family="'JetBrains Mono', 'Fira Code', monospace" font-size="34" font-weight="900" fill="#ffffff">
      SYSTEMS &amp; BINARY TOOLING
    </text>
    <text y="30" font-family="'JetBrains Mono', 'Fira Code', monospace" font-size="14" fill="#00f5d4" font-weight="600">
      &gt; Memory Lifecycles · Kernel Hooks · Engine Derivation
    </text>
  </g>

  <!-- HUD Telemetry Boxes -->
  <g transform="translate(32, 160)">
    <!-- Box 1 -->
    <rect width="180" height="65" rx="6" fill="#030712" stroke="#1e293b" />
    <text x="12" y="22" font-family="monospace" font-size="10" fill="#64748b">CORE STACK</text>
    <text x="12" y="44" font-family="monospace" font-size="13" font-weight="bold" fill="#38bdf8">C++20 · Rust · ASM</text>
    <rect class="bar-dynamic" x="12" y="52" height="3" rx="1.5" fill="#38bdf8" />

    <!-- Box 2 -->
    <rect x="195" width="180" height="65" rx="6" fill="#030712" stroke="#1e293b" />
    <text x="207" y="22" font-family="monospace" font-size="10" fill="#64748b">HOOK STATUS</text>
    <text x="207" y="44" font-family="monospace" font-size="13" font-weight="bold" fill="#4ade80">MinHook · Active</text>
    <rect class="bar-dynamic-2" x="207" y="52" height="3" rx="1.5" fill="#4ade80" />

    <!-- Box 3 -->
    <rect x="390" width="180" height="65" rx="6" fill="#030712" stroke="#1e293b" />
    <text x="402" y="22" font-family="monospace" font-size="10" fill="#64748b">PEB BASE &amp; SYSCALL</text>
    <text x="402" y="44" font-family="monospace" font-size="13" font-weight="bold" fill="#c084fc">0x7FFE03300000</text>
    <rect x="402" y="52" width="130" height="3" rx="1.5" fill="#c084fc" />
  </g>

  <!-- Equalizer Activity Stream & Log Bar -->
  <g transform="translate(32, 270)">
    <rect width="570" height="42" rx="5" fill="#050811" stroke="#00f5d4" stroke-opacity="0.3" />
    
    <!-- Mini Equalizer bars -->
    <g transform="translate(14, 6)" fill="#00f5d4">
      <rect class="eq-1" x="0" y="4" width="3" height="24" rx="1" />
      <rect class="eq-2" x="6" y="8" width="3" height="20" rx="1" />
      <rect class="eq-3" x="12" y="2" width="3" height="26" rx="1" />
      <rect class="eq-4" x="18" y="10" width="3" height="18" rx="1" />
    </g>

    <text x="45" y="26" font-family="monospace" font-size="11" fill="#4ade80">
      [LIVE] <tspan fill="#94a3b8">Scanner:</tspan> 16/16 offsets <tspan fill="#38bdf8">|</tspan> <tspan fill="#94a3b8">Tick:</tspan> 3.8ms <tspan fill="#38bdf8">|</tspan> <tspan fill="#00f5d4">RPM/WPM: Ready</tspan>
    </text>
  </g>

  <!-- Animated Radar (Right Side) -->
  <g>
    <circle cx="735" cy="170" r="75" fill="url(#radarGlow)" stroke="#00f5d4" stroke-opacity="0.3" stroke-width="1.5" />
    <circle cx="735" cy="170" r="50" fill="none" stroke="#00f5d4" stroke-opacity="0.2" stroke-dasharray="3,3" />
    <circle cx="735" cy="170" r="25" fill="none" stroke="#00f5d4" stroke-opacity="0.3" />
    
    <line x1="655" y1="170" x2="815" y2="170" stroke="#00f5d4" stroke-opacity="0.3" />
    <line x1="735" y1="90" x2="735" y2="250" stroke="#00f5d4" stroke-opacity="0.3" />

    <!-- Sweep arm -->
    <g class="radar-arm">
      <line x1="735" y1="170" x2="810" y2="170" stroke="#00f5d4" stroke-width="2" stroke-opacity="0.9" />
      <polygon points="735,170 810,150 810,170" fill="url(#radarGlow)" opacity="0.6" />
    </g>

    <circle cx="755" cy="140" r="3" fill="#00f5d4" class="pulsing-dot" />
    <circle cx="715" cy="195" r="2" fill="#4ade80" />
    <circle cx="780" cy="180" r="2.5" fill="#38bdf8" />
    <text x="735" y="272" text-anchor="middle" font-family="monospace" font-size="10" fill="#00f5d4" letter-spacing="1">RADAR SECTOR A-9</text>
  </g>
</svg>