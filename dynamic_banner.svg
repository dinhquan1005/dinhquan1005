<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 280" width="100%" height="100%">
  <defs>
    <!-- Midnight Black to Deep Navy Base -->
    <linearGradient id="bgMain" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#05070e" />
      <stop offset="55%" stop-color="#0b1120" />
      <stop offset="100%" stop-color="#111029" />
    </linearGradient>

    <!-- Electric Blue & Violet Ambient Glow -->
    <radialGradient id="glowBlue" cx="20%" cy="25%" r="45%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.18" />
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0" />
    </radialGradient>
    <radialGradient id="glowViolet" cx="82%" cy="75%" r="48%">
      <stop offset="0%" stop-color="#8b5cf6" stop-opacity="0.22" />
      <stop offset="100%" stop-color="#8b5cf6" stop-opacity="0" />
    </radialGradient>

    <!-- Accent Gradient -->
    <linearGradient id="accentLine" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0" />
      <stop offset="35%" stop-color="#38bdf8" stop-opacity="0.85" />
      <stop offset="65%" stop-color="#8b5cf6" stop-opacity="0.85" />
      <stop offset="100%" stop-color="#8b5cf6" stop-opacity="0" />
    </linearGradient>

    <linearGradient id="titleGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f8fafc" />
      <stop offset="65%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#a78bfa" />
    </linearGradient>

    <style>
      @keyframes pulseSoft {
        0%, 100% { opacity: 0.65; }
        50% { opacity: 1; }
      }
      @keyframes scanSlow {
        0% { transform: translateX(-900px); }
        100% { transform: translateX(900px); }
      }
      .dot-live { animation: pulseSoft 2.4s ease-in-out infinite; }
      .shimmer { animation: scanSlow 6s ease-in-out infinite; }
    </style>
  </defs>

  <!-- Canvas -->
  <rect width="900" height="280" rx="16" fill="url(#bgMain)" />
  <rect width="900" height="280" rx="16" fill="url(#glowBlue)" />
  <rect width="900" height="280" rx="16" fill="url(#glowViolet)" />

  <!-- Subtle Technical Grid -->
  <g stroke="#38bdf8" stroke-opacity="0.045" stroke-width="1">
    <line x1="0" y1="56" x2="900" y2="56" />
    <line x1="0" y1="112" x2="900" y2="112" />
    <line x1="0" y1="168" x2="900" y2="168" />
    <line x1="0" y1="224" x2="900" y2="224" />
    <line x1="150" y1="0" x2="150" y2="280" />
    <line x1="300" y1="0" x2="300" y2="280" />
    <line x1="450" y1="0" x2="450" y2="280" />
    <line x1="600" y1="0" x2="600" y2="280" />
    <line x1="750" y1="0" x2="750" y2="280" />
  </g>

  <!-- Outer Glass Border -->
  <rect x="1" y="1" width="898" height="278" rx="15" fill="none" stroke="#38bdf8" stroke-opacity="0.22" stroke-width="1" />

  <!-- Top Accent Line & Shimmer -->
  <rect x="40" y="0" width="820" height="2" fill="url(#accentLine)" />
  <rect class="shimmer" x="0" y="0" width="260" height="2" fill="url(#accentLine)" opacity="0.7" />

  <!-- Top Status Row -->
  <g transform="translate(44, 42)" font-family="'Segoe UI', -apple-system, BlinkMacSystemFont, Roboto, sans-serif" font-size="12">
    <circle cx="5" cy="-4" r="4" fill="#38bdf8" class="dot-live" />
    <text x="18" y="0" fill="#94a3b8" font-weight="600" letter-spacing="1.5">PORTFOLIO // @DINHQUAN1005</text>
    <text x="812" y="0" text-anchor="end" fill="#64748b" font-family="monospace" font-size="11">11 PUBLIC REPOS · VIETNAM</text>
  </g>

  <!-- Hero Identity -->
  <g transform="translate(44, 108)">
    <text font-family="'Segoe UI', -apple-system, BlinkMacSystemFont, Roboto, sans-serif" font-size="44" font-weight="800" fill="url(#titleGrad)" letter-spacing="-0.5">
      DINH QUAN
    </text>
    <text y="34" font-family="'Segoe UI', -apple-system, BlinkMacSystemFont, Roboto, sans-serif" font-size="18" font-weight="600" fill="#e2e8f0" letter-spacing="0.4">
      Full-Stack · Mobile · Web3 Developer
    </text>
    <text y="62" font-family="'Segoe UI', -apple-system, BlinkMacSystemFont, Roboto, sans-serif" font-size="13.5" fill="#94a3b8">
      Building end-to-end products across Flutter, ASP.NET Core, Node.js, React &amp; Solidity.
    </text>
  </g>

  <!-- Glassmorphic Stack Cards -->
  <g transform="translate(44, 202)" font-family="'Segoe UI', -apple-system, BlinkMacSystemFont, Roboto, sans-serif">
    <!-- Card 1 -->
    <rect width="256" height="48" rx="10" fill="#0f172a" fill-opacity="0.72" stroke="#38bdf8" stroke-opacity="0.28" stroke-width="1" />
    <text x="16" y="20" font-size="10" font-weight="700" fill="#38bdf8" letter-spacing="1">MOBILE &amp; CLOUD</text>
    <text x="16" y="37" font-size="12.5" font-weight="600" fill="#e2e8f0">Flutter · Dart · Firebase</text>

    <!-- Card 2 -->
    <rect x="278" width="256" height="48" rx="10" fill="#0f172a" fill-opacity="0.72" stroke="#8b5cf6" stroke-opacity="0.32" stroke-width="1" />
    <text x="294" y="20" font-size="10" font-weight="700" fill="#a78bfa" letter-spacing="1">FULL-STACK WEB</text>
    <text x="294" y="37" font-size="12.5" font-weight="600" fill="#e2e8f0">React · Node.js · ASP.NET 8</text>

    <!-- Card 3 -->
    <rect x="556" width="256" height="48" rx="10" fill="#0f172a" fill-opacity="0.72" stroke="#38bdf8" stroke-opacity="0.28" stroke-width="1" />
    <text x="572" y="20" font-size="10" font-weight="700" fill="#38bdf8" letter-spacing="1">BLOCKCHAIN &amp; DATA</text>
    <text x="572" y="37" font-size="12.5" font-weight="600" fill="#e2e8f0">Solidity · Hardhat · SQL Server</text>
  </g>
</svg>
