<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 850 180" width="100%" height="100%">
  <defs>
    <style>
      @keyframes snakeMove {
        0% { transform: translate(0px, 0px); }
        25% { transform: translate(140px, 0px); }
        30% { transform: translate(140px, 28px); }
        55% { transform: translate(380px, 28px); }
        60% { transform: translate(380px, 56px); }
        85% { transform: translate(620px, 56px); }
        90% { transform: translate(620px, 14px); }
        100% { transform: translate(0px, 0px); }
      }
      .snake { animation: snakeMove 12s linear infinite; }
    </style>
  </defs>
  <rect width="850" height="180" rx="10" fill="#ffffff" stroke="#e1e4e8" stroke-width="1" />
  <text x="30" y="24" font-family="'JetBrains Mono', monospace" font-size="12" font-weight="bold" fill="#586069">dinhquan1005's Contribution Snake</text>
  <g transform="translate(30, 36)" fill="#ebedf0">
    <rect x="0" y="0" width="11" height="11" rx="2" fill="#9be9a8" /><rect x="14" y="0" width="11" height="11" rx="2" fill="#40c463" /><rect x="28" y="0" width="11" height="11" rx="2" fill="#30a14e" /><rect x="42" y="0" width="11" height="11" rx="2" fill="#216e39" />
    <g class="snake">
      <rect x="0" y="0" width="11" height="11" rx="2" fill="#3b82f6" opacity="0.6" />
      <rect x="14" y="0" width="11" height="11" rx="2" fill="#3b82f6" opacity="0.8" />
      <rect x="28" y="0" width="11" height="11" rx="2" fill="#00599c" />
    </g>
  </g>
</svg>